<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Class</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:#000;
    color:#EDEDED;
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
  }
  .card{
    text-align:center;
    max-width:420px;
    width:100%;
  }
  .logo{
    width:150px;
    height:auto;
    margin-bottom:28px;
    filter: drop-shadow(0 0 24px rgba(255,255,255,0.06));
  }
  .tagline{
    font-size:14px;
    letter-spacing:0.06em;
    color:#8A8A8A;
    margin-bottom:40px;
    text-transform:uppercase;
  }
  .links{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .links a{
    display:block;
    padding:14px 20px;
    border:1px solid #2A2A2A;
    border-radius:4px;
    color:#EDEDED;
    text-decoration:none;
    font-size:15px;
    font-weight:500;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .links a:hover{
    border-color:#EDEDED;
    background:#0D0D0D;
  }
  .links a.primary{
    background:#EDEDED;
    color:#000;
    border-color:#EDEDED;
    font-weight:600;
  }
  .links a.primary:hover{
    background:#fff;
  }
  .tiktoks{
    display:flex;
    gap:10px;
    margin-top:12px;
  }
  .tiktoks a{
    flex:1;
    font-size:13px;
    padding:12px 8px;
  }
  footer{
    margin-top:44px;
    font-size:12px;
    color:#4A4A4A;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="logo" src="assets/logo.png" alt="High Class logo">
    <div class="tagline">Roblox Truck Meet Roleplay</div>

    <div class="links">
      <a class="primary" href="https://discord.gg/3sxHnyNNq" target="_blank" rel="noopener">Join the Discord</a>
      <div class="tiktoks">
        <a href="https://www.tiktok.com/@highclasslive" target="_blank" rel="noopener">@highclasslive</a>
        <a href="https://www.tiktok.com/@solariumedits1" target="_blank" rel="noopener">@solariumedits1</a>
        <a href="https://www.tiktok.com/@5harvo" target="_blank" rel="noopener">@5harvo</a>
      </div>
    </div>

    <footer>highclasstrucks.com</footer>
  </div>

</body>
</html>
