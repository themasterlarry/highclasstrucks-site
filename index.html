<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>High Class</title>
<meta name="description" content="High Class – Roblox truck meet roleplay.">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#000;color:#E8E8EA;font-family:'Manrope',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;min-height:100vh}
  a{color:inherit;text-decoration:none}
  /* 3D chrome logo (rendered live with three.js); the flat image shows only if 3D can't run */
  .logo3d{position:relative;width:min(440px,94vw);aspect-ratio:11/7;margin:-24px auto 4px;left:50%;transform:translateX(-50%)}
  .logo3d canvas{position:absolute;inset:0;width:100%!important;height:100%!important}
  .logo3d img{position:absolute;left:50%;top:50%;width:271px;max-width:80%;transform:translate(-50%,-50%)}
  .logo3d.live img{display:none}
  .tagline{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;text-align:center;color:#9A9A9A}
  .suits{text-align:center;color:#5c5c63;font-size:13px;letter-spacing:.9em;text-indent:.9em;margin-top:10px}
  .count{font-size:13px;color:#8a8a92;margin-top:6px;min-height:20px;text-align:center}
  .links{display:flex;flex-direction:column;gap:12px;margin-top:30px}
  .links a{display:block;text-align:center;padding:14px 20px;border:1px solid #2A2A2A;border-radius:4px;color:#EDEDED;background:#000;font-size:15px;font-weight:600;transition:border-color .15s,background .15s}
  .links a:hover{border-color:#EDEDED;background:#0D0D0D}
  .links a.primary{background:#EDEDED;border-color:#EDEDED;color:#000;font-weight:600}
  .links a.primary:hover{background:#fff}
  .tiktoks{display:flex;gap:10px}.tiktoks a{flex:1;font-size:13px;padding:12px 6px;overflow-wrap:anywhere}
  /* photo tiles in the button stack: two photos, then a third with "+N" */
  .shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .group{margin-top:18px}
  .group[hidden]{display:none}
  .glabel{font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:#7A7A80;text-align:center;margin-bottom:10px}
  .shots button{position:relative;padding:0;aspect-ratio:4/3;border:1px solid #2A2A2A;border-radius:4px;overflow:hidden;background:#0a0a0a;cursor:pointer}
  .shots img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s ease}
  .shots button:hover{border-color:#EDEDED}
  .shots button:hover img{transform:scale(1.06)}
  .shots .more{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:17px;font-weight:700}
  footer{margin-top:36px;font-size:12px;color:#55555c;text-align:center}
  .fade div{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1.6s}
  .fade div.on{opacity:1}
  #view{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:20px;cursor:pointer;z-index:9}
  #view img{max-width:100%;max-height:88vh;border-radius:6px}
  #view .nav{position:absolute;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:44px;padding:10px 18px;cursor:pointer;opacity:.75}
  #view .nav:hover{opacity:1}#view .p{left:6px}#view .n{right:6px}
  .card{width:100%;max-width:420px}

  /* ---------- A: Night meet -- photos fill the page ---------- */
  .A .wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
  .A #bg{position:fixed;inset:0;z-index:-1}
  .A #bg::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.55) 45%,rgba(0,0,0,.9))}
  .A .links a:not(.primary){background:rgba(0,0,0,.75)}

</style>
</head>

<div id="bg" class="fade"></div>

<div class="wrap">
  <div class="card">
    <div class="logo3d" id="logo3d"><img src="assets/logo-cards.webp" alt="High Class"></div>
    <div class="tagline">Roblox Truck Meet Roleplay</div>
    <div class="suits">♠♥♦♣</div>
    <div class="count" id="count"></div>

    <footer>♠&nbsp; highclasstrucks.com &nbsp;♠</footer>
  </div>
</div>

<script>
  // truck screenshots -- put them in assets/trucks/ (missing ones are skipped)
  var photos = ["1.jpg", "2.jpg", "3.jpg", "4.jpg", "5.jpg", "6.jpg"];

  var found = [], left = photos.length;
  photos.forEach(function (name, i) {
    var src = name.indexOf("http") === 0 ? name : "assets/trucks/" + name;
    var img = new Image();
    img.onload = function () { found[i] = src; done(); };
    img.onerror = done;
    img.src = src;
  });

  function done() {
    if (--left > 0) return;
    found = found.filter(Boolean);
    if (!found.length) return;
    ["bg"].forEach(function (id, k) {
      var box = document.getElementById(id);
      found.forEach(function (src, i) {
        var d = document.createElement("div");
        d.style.backgroundImage = "url('" + src + "')";
        if (i === k % found.length) d.className = "on";
        box.insertBefore(d, box.firstChild);
      });
    });
    setInterval(function () {
      ["bg"].forEach(function (id) {
        var L = [].filter.call(document.getElementById(id).children, function (e) { return e.tagName === "DIV"; });
        var n = L.findIndex(function (e) { return e.className === "on"; });
        L[n].className = ""; L[(n + 1) % L.length].className = "on";
      });
    }, 7000);
    var shots = document.getElementById("shots");
    found.slice(0, 3).forEach(function (src, i) {
      var b = document.createElement("button");
      b.setAttribute("aria-label", "Open photo " + (i + 1));
      b.innerHTML = '<img src="' + src + '" alt="High Class meet">' +
        (i === 2 && found.length > 3 ? '<span class="more">+' + (found.length - 3) + '</span>' : "");
      b.onclick = function () { show(i); };
      shots.appendChild(b);
    });
    document.getElementById("shotgroup").hidden = false;
  }

  var view = document.getElementById("view"), at = 0;
  function show(i) { at = (i + found.length) % found.length; view.querySelector("img").src = found[at]; view.style.display = "flex"; }
  view.onclick = function (e) { if (e.target === view || e.target.tagName === "IMG") view.style.display = "none"; };
  view.querySelector(".p").onclick = function () { show(at - 1); };
  view.querySelector(".n").onclick = function () { show(at + 1); };
  document.addEventListener("keydown", function (e) {
    if (view.style.display !== "flex") return;
    if (e.key === "Escape") view.style.display = "none";
    if (e.key === "ArrowLeft") show(at - 1);
    if (e.key === "ArrowRight") show(at + 1);
  });


  fetch("https://discord.com/api/v10/invites/highclass?with_counts=true")
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || !j.approximate_member_count) return;
      document.getElementById("count").textContent =
        j.approximate_member_count.toLocaleString() + " members · " + j.approximate_presence_count.toLocaleString() + " online";
    }).catch(function () {});
</script>

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "low-power" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  box.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const pmrem = new THREE.PMREMGenerator(renderer);
  const room = new RoomEnvironment(renderer);
  // bright light strips + a dark floor give chrome its sharp highlights and horizon line
  const strip = new THREE.MeshBasicMaterial({ color: new THREE.Color(12, 12, 13) });
  for (const [y, z, w] of [[4.5, -2, 14], [2.2, -6, 10], [-0.5, 6, 12]]) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.35, 0.35), strip); m.position.set(0, y, z); room.add(m);
  }
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x050506 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -2.2; room.add(floor);
  scene.environment = pmrem.fromScene(room, 0.02).texture;
  const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 50);
  camera.position.set(0, 0.05, 4.5);

  const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(2, 3, 4); scene.add(key);
  const rim = new THREE.DirectionalLight(0xb8c4ff, 1.4); rim.position.set(-3, 1, -2); scene.add(rim);

  const chrome = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 1, roughness: 0.06 });
  const chromeDark = new THREE.MeshStandardMaterial({ color: 0xd8dbe2, metalness: 1, roughness: 0.22 });
  const face = new THREE.MeshPhysicalMaterial({ color: 0x050506, metalness: 0, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.15, envMapIntensity: 0.25 });

  // glyph outline commands -> three.js shapes
  function shapesOf(cmds, s, ox, oy) {
    const p = new THREE.ShapePath();
    for (const c of cmds) {
      const v = c.slice(1).map((n, i) => (i % 2 ? n * s + oy : n * s + ox));
      if (c[0] === "M") p.moveTo(v[0], v[1]);
      else if (c[0] === "L") p.lineTo(v[0], v[1]);
      else if (c[0] === "Q") p.quadraticCurveTo(v[0], v[1], v[2], v[3]);
      else if (c[0] === "C") p.bezierCurveTo(v[0], v[1], v[2], v[3], v[4], v[5]);
    }
    // Sort contours into outlines and holes by nesting (not winding), so every font draws correctly
    const subs = p.subPaths.map(sp => ({ sp, pts: sp.getPoints(8) })).filter(o => o.pts.length > 2);
    const inside = (pt, poly) => { let c = false;
      for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
        const a = poly[i], b = poly[j];
        if ((a.y > pt.y) !== (b.y > pt.y) && pt.x < (b.x - a.x) * (pt.y - a.y) / (b.y - a.y) + a.x) c = !c; }

      const sh = new THREE.Shape(); sh.curves = o.sp.curves; sh.currentPoint = o.sp.currentPoint;

      out.push(sh);
    });

    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);

    const card = new THREE.Group();
    card.add(new THREE.Mesh(faceGeo, face));
    const fr = new THREE.Mesh(frameGeo, chrome); fr.position.z = -0.003; card.add(fr);
    const big = centered(SH.suits[st], 0.3);
    const bigM = new THREE.Mesh(ext(shapesOf(SH.suits[st], big.k, big.ox, big.oy), 0.02, 0.008), chrome);

    }

    const w = box.clientWidth, h = box.clientHeight;

  }
  size(); addEventListener("resize", size);

  let mx = 0, my = 0;
  addEventListener("pointermove", e => { mx = e.clientX / innerWidth - 0.5; my = e.clientY / innerHeight - 0.5; });

  renderer.setAnimationLoop(() => {
    const s = still ? 0 : clock.getElapsedTime();
    logo.rotation.y += ((Math.sin(s * 0.55) * 0.55 + mx * 0.5) - logo.rotation.y) * 0.08;
    logo.rotation.x += ((Math.sin(s * 0.4) * 0.06 + my * 0.25) - logo.rotation.x) * 0.08;

  console.warn("3D logo unavailable, using the image instead", e);
